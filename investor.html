<!-- Investor Modal -->
<div id="investorModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background-color: rgba(0, 0, 0, 0.8); z-index: 1000; display: flex; align-items: center; justify-content: center;">
  <div style="width: 90%; max-width: 900px; background-color: #fff; padding: 2rem; border-radius: 10px; position: relative;">
    
    <!-- ❌ Close Button -->
    <button onclick="closeInvestorModal()" 
            style="position: absolute; top: 100px; right: 15px; background: none; border: none; font-size: 28px; font-weight: bold; cursor: pointer; color: #333;">
      &times;
    </button>

    <!-- 🏦 Header -->
    <h2 style="text-align: center; margin-bottom: 1rem; margin-top: 60px;">💼 Investor Interest – ColabEsports</h2>
    <p style="text-align: center; margin-bottom: 2rem;">
      Interested in investing in India's next big esports platform? Fill out this form and we'll contact you shortly.
    </p>

    <!-- 📋 Google Form Embed -->
    <iframe 
      src="https://docs.google.com/forms/d/e/1FAIpQLSf0ZFFqXaUNoRszEPuS3WLy_Nn4zkf7U2fhLMagggfiSmV0PA/viewform?embedded=true" 
      width="100%" 
      height="900" 
      frameborder="0" 
      marginheight="0" 
      marginwidth="0"
    
      style="border-radius: 8px; background: #f9f9f9;">
      Loading…
    </iframe>
  </div>
</div>

<script>
  // Open the modal
  document.getElementById('refer-cafe-btn').addEventListener('click', function () {
    document.getElementById('refer-cafe-modal').classList.remove('hidden');
  });

  // Close modal and go to index.html
  document.querySelector('.close').addEventListener('click', function () {
    document.getElementById('refer-cafe-modal').classList.add('hidden');

    // ✅ Redirect to index.html after slight delay
    setTimeout(function () {
      window.location.href = "https://www.colabesports.in/index.html";
    },); // 300ms delay for smoother experience
  });
</script>
